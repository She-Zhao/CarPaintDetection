[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "carpaintdetection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8,<4.10",
    "pypylon>=4.2.0",
    "screeninfo>=0.8.1",
    "torch>=2.1.0,<2.2.0",
    "torchvision>=0.16.0,<0.17.0",
    "torchaudio>=2.1.0,<2.2.0",
    "numpy>=1.20,<2",
    "ultralytics",
    "pyqt5>=5.15.11",
    "pyqt5-qt5==5.15.2",
]

[tool.hatch.build.targets.wheel]
packages = ["framework"]

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu121", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu121", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
  { index = "pytorch-cu121", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
ultralytics = { workspace = true }

[tool.uv.workspace]
members = [
    "ultralytics_custom",
]

